<!DOCTYPE html>

<html>

<head>

<title>SST AI Scanner</title>

<style>

body{
background:#080d12;
color:white;
font-family:Arial;
padding:20px;
}


h1{
color:#00ff99;
}


input,button{

padding:10px;
margin:5px;

}


button{

background:#00ff99;
border:0;
cursor:pointer;

}


table{

width:100%;
border-collapse:collapse;

}


td,th{

padding:10px;
border-bottom:1px solid #333;
text-align:center;

}


.bull{

color:#00ff99;

}

</style>

</head>


<body>


<h1>🚀 SST AI Scanner PRO</h1>


<input id="ticker"
placeholder="Ticker">


<button onclick="add()">
Add
</button>



<h3>
🔥 Top Setups
</h3>

<div id="top"></div>



<table>

<thead>

<tr>

<th>Ticker</th>
<th>Price</th>
<th>RSI</th>
<th>EMA</th>
<th>VWAP</th>
<th>Volume Spike</th>
<th>Breakout</th>
<th>AI Score</th>

</tr>

</thead>


<tbody id="data"></tbody>


</table>



<script>


let tickers=[
"NVDA",
"TSLA",
"AAPL"
];



function add(){

let t=document
.getElementById("ticker")
.value
.toUpperCase();


tickers.push(t);

load();

}



async function scan(t){


let r=await fetch(
"http://localhost:5000/scan?ticker="+t
);


return await r.json();


}



async function load(){


let html="";

let setups=[];


for(let t of tickers){


let d=await scan(t);


if(d.error){

html+=`

<tr>
<td>${t}</td>
<td colspan="7">
${d.error}
</td>
</tr>

`;

continue;

}



setups.push(d);



html+=`

<tr>

<td>${d.ticker}</td>

<td>${d.price}</td>

<td>${d.rsi}</td>

<td>${d.ema}</td>

<td>${d.vwap}</td>

<td>
${d.volume_spike?"🔥 YES":"NO"}
</td>

<td>
${d.breakout?"🚀 YES":"NO"}
</td>


<td class="bull">
${d.score}%
</td>


</tr>


`;


}


document
.getElementById("data")
.innerHTML=html;



setups.sort(
(a,b)=>b.score-a.score
);



document
.getElementById("top")
.innerHTML=
setups
.slice(0,3)
.map(
(x)=>
x.ticker+
" → "+
x.score+
"%"
)
.join("<br>");



}


load();


setInterval(load,30000);



</script>


</body>

</html>
